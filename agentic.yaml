name: agentic

on: workflow_dispatch

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Run job commands
        run: |
          scripts/install
          scripts/check
          scripts/build
          scripts/test
          scripts/coverage
